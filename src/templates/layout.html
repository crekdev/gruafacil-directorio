<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ seo.title }}</title>
  <meta name="description" content="{{ seo.description }}">
  <link rel="canonical" href="{{ seo.canonical }}">
  <meta name="robots" content="{{ seo.robots }}">
  <meta name="theme-color" content="#1d2a5d">
  {{#if site.googleVerification}}<meta name="google-site-verification" content="{{ site.googleVerification }}">{{/if}}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GrúaFácil">
  <meta property="og:locale" content="es_CL">
  <meta property="og:title" content="{{ seo.title }}">
  <meta property="og:description" content="{{ seo.description }}">
  <meta property="og:url" content="{{ seo.canonical }}">
  <meta property="og:image" content="{{ seo.ogImage }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/favicon.png" type="image/png" sizes="36x36">
  <link rel="apple-touch-icon" href="/assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/assets/css/main.css?v={{ site.assetV }}">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sen:wght@400;700;800&amp;display=swap"></noscript>
  {{{ jsonld }}}
</head>
<body data-gtm="{{ site.gtmId }}">
{{> sprite}}
{{> header}}
<main id="contenido">
{{{ content }}}
</main>
{{> footer}}
<script src="/assets/js/main.js?v={{ site.assetV }}" defer></script>
</body>
</html>
